[package]
name = "nestos-node"
version = "0.4.3"
edition = "2021"
description = "NestOS personal intelligence node for controlled files, projects, sync and AI harness sessions"
repository = "https://github.com/mushuanli/nestos-node"
homepage = "https://github.com/mushuanli/nestos-node"
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
toml_edit = "0.22"
rustix = { version = "1", features = ["fs", "process", "param"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]

[features]
sync-fault-injection = []

