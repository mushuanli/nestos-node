# Harness-only gateway. Replace paths with existing absolute directories.
listen = "127.0.0.1:8787"
server_id = "my-agent-node"
execution = false
allowed_origins = ["http://localhost:3000", "http://localhost:1420"]
api_key_env = "CELLS_API_KEY"

[[harnesses]]
id = "codex"
kind = "codex"
command = "codex"
home = "/home/your-user/.codex"

[[harnesses.workspaces]]
id = "project"
path = "/srv/projects/demo"

# Optional read-only file browsing. Writable exclusive exports cannot overlap
# a harness workspace because Codex writes outside the file revision gateway.
# [[exports]]
# alias = "demo"
# path = "/srv/projects/demo"
# access = "ro"

# Optional Claude Code profile. home is CLAUDE_CONFIG_DIR, never inferred.
# [[harnesses]]
# id = "claude"
# kind = "claude"
# command = "/usr/local/bin/claude"
# home = "/home/your-user/.claude"
# [[harnesses.workspaces]]
# id = "project"
# path = "/srv/projects/demo"
