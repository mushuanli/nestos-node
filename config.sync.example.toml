# Sync-only instance: no exports and no bubblewrap dependency.
listen = "127.0.0.1:8787"
execution = false
log_level = "info"
api_key_env = "CELLS_API_KEY"
allowed_origins = ["http://localhost:3000", "http://localhost:1420"]

[sync]
enabled = true
root = "/srv/cells-sync"
# A missing or empty root is initialized on first start; `sync init` does it explicitly.
# All other sync settings use built-in defaults; override only when needed.
# Optional: detect accidental storage replacement, including an auto-created store.
# expected_authority_id = "<authorityId from sync capabilities>"
